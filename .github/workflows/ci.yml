name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Update Mooncakes registry
        run: moon update

      - name: Check formatting
        run: moon fmt --check

      - name: Verify generated interfaces
        run: |
          moon info
          git diff --exit-code -- '**/pkg.generated.mbti'

      - name: Check all targets
        run: moon check --target all --deny-warn

      - name: Strict tests
        run: moon test --target all --deny-warn

      - name: Build example
        run: moon build --target all examples/code_assistant

      - name: Run example
        run: moon run examples/code_assistant